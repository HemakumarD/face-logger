<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://cdn.jsdelivr.net https://accounts.google.com;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Face Logger – Face Admin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --accent:#6c63ff;--cyan:#00d4ff;--green:#00ff9d;--red:#ff4466;--yellow:#ffcc00;
  --text:#e0e0f0;--muted:#888;--radius:16px;--font:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
header{background:linear-gradient(135deg,rgba(108,99,255,0.15),rgba(0,212,255,0.08));
  border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;gap:14px}
.logo-sm{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--cyan));
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
header h1{font-size:1.1rem;font-weight:700}
header h1 span{color:var(--accent)}
.slot-badge{margin-left:auto;padding:4px 10px;border-radius:6px;background:rgba(0,212,255,.15);
  color:var(--cyan);font-size:.75rem;border:1px solid rgba(0,212,255,.3)}
.nav{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;background:rgba(0,0,0,.3)}
.nav a{padding:12px 18px;text-decoration:none;color:var(--muted);font-size:.85rem;font-weight:600;
  white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}
.nav a.active,.nav a:hover{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:24px 16px}
/* AUTH BANNER */
#auth-section{background:rgba(108,99,255,.08);border:1px solid rgba(108,99,255,.25);border-radius:var(--radius);
  padding:20px;margin-bottom:24px}
#auth-section h2{font-size:1rem;margin-bottom:12px;color:var(--accent)}
.auth-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.auth-field{flex:1;min-width:200px}
.auth-field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);
  letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);
  border-radius:10px;color:var(--text);font-size:.9rem;padding:10px 12px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);background:rgba(108,99,255,.08)}
select option{background:#1a1a2e}
.btn{padding:10px 18px;border:none;border-radius:10px;font-size:.85rem;font-weight:700;
  cursor:pointer;transition:.2s;letter-spacing:.02em;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff}
.btn-sm{padding:7px 14px;font-size:.8rem}
.btn-danger{background:rgba(255,68,102,.15);color:var(--red);border:1px solid rgba(255,68,102,.3)}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn:active{opacity:.8;transform:scale(.97)}
#gis-btn{margin-top:8px}
/* REGISTER SECTION */
#register-section{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px}
#register-section h2{font-size:1rem;margin-bottom:16px;color:var(--cyan)}
.cam-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:400px;margin:0 auto}
#reg-video{width:100%;height:100%;object-fit:cover;display:block}
#reg-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.guide-box{width:140px;height:140px;border:2px solid var(--cyan);border-radius:12px;position:relative}
.guide-box::before,.guide-box::after{content:'';position:absolute;border:3px solid var(--cyan);border-radius:3px}
.guide-box::before{top:-1px;left:-1px;width:24px;height:24px;border-right:none;border-bottom:none}
.guide-box::after{bottom:-1px;right:-1px;width:24px;height:24px;border-left:none;border-top:none}
.guide-label{font-size:.75rem;color:var(--cyan);text-align:center;background:rgba(0,0,0,.7);
  padding:4px 10px;border-radius:6px;border:1px solid rgba(0,212,255,.3)}
.reg-controls{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.reg-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
#reg-name{flex:1;min-width:160px}
#sample-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:8px}
#sample-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));width:0;transition:.4s}
#sample-status{font-size:.8rem;color:var(--muted);margin-top:4px}
/* FACES LIST */
#faces-section h2{font-size:1rem;margin-bottom:16px;color:var(--text)}
.search-row{display:flex;gap:10px;margin-bottom:16px}
.search-row input{flex:1}
#faces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.face-card{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:12px;
  text-align:center;position:relative;transition:.2s}
.face-card:hover{border-color:rgba(108,99,255,.5);background:rgba(108,99,255,.08)}
.face-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border);
  margin:0 auto 8px;background:#1a1a2e;display:block}
.face-avatar-placeholder{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--cyan));
  margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.face-name{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face-samples{font-size:.7rem;color:var(--muted);margin-top:2px}
.face-delete{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:6px;
  background:rgba(255,68,102,.2);border:none;color:var(--red);cursor:pointer;font-size:.7rem;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s}
.face-card:hover .face-delete{opacity:1}
/* STATUS */
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:12px;font-size:.85rem;
  font-weight:600;z-index:999;animation:fadeUp .3s ease;max-width:300px;line-height:1.4}
.toast.success{background:rgba(0,255,157,.15);border:1px solid rgba(0,255,157,.4);color:var(--green)}
.toast.error{background:rgba(255,68,102,.15);border:1px solid rgba(255,68,102,.4);color:var(--red)}
.toast.info{background:rgba(108,99,255,.15);border:1px solid rgba(108,99,255,.4);color:var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* LOADER */
#model-loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:200}
.loader-spin{font-size:40px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-label{font-size:.9rem;color:var(--muted)}
.prog-bar{width:220px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));width:0;transition:.3s}
/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>

<div id="model-loader">
  <div class="loader-spin">🧠</div>
  <div class="loader-label" id="ml-text">Loading AI models…</div>
  <div class="prog-bar"><div class="prog-fill" id="ml-prog"></div></div>
</div>

<header>
  <div class="logo-sm">👁</div>
  <h1>Face <span>Logger</span> Admin</h1>
  <div class="slot-badge" id="slot-label">Not configured</div>
</header>

<nav class="nav">
  <a href="camera.html">📷 Camera</a>
  <a href="admin.html" class="active">👤 Faces</a>
  <a href="dashboard.html">📊 Dashboard</a>
</nav>

<main>

  <!-- AUTH -->
  <div id="auth-section">
    <h2>🔑 Slot Connection</h2>
    <div class="auth-row">
      <div class="auth-field">
        <label>Script URL</label>
        <input id="a-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
      </div>
      <div class="auth-field" style="max-width:160px">
        <label>Slot</label>
        <select id="a-slot">
          <option value="">Select…</option>
        </select>
      </div>
      <div class="auth-field" style="max-width:200px">
        <label>API Token</label>
        <input id="a-token" type="password" placeholder="Paste token">
      </div>
      <button class="btn btn-primary btn-sm" onclick="saveAuth()">Connect</button>
    </div>
    <div id="gis-btn"></div>
  </div>

  <!-- REGISTER -->
  <div id="register-section">
    <h2>📸 Register New Face</h2>
    <div class="cam-wrap">
      <video id="reg-video" autoplay playsinline muted></video>
      <canvas id="reg-canvas"></canvas>
      <div id="cam-overlay">
        <div class="guide-box"></div>
        <div class="guide-label">Position face in box</div>
      </div>
    </div>
    <div class="reg-controls">
      <div class="reg-row">
        <input id="reg-name" type="text" placeholder="Person's full name" autocomplete="off">
        <button class="btn btn-ghost btn-sm" onclick="captureOnce()">📷 Capture</button>
        <button class="btn btn-primary btn-sm" id="auto-btn" onclick="toggleAuto()">▶ Auto (5)</button>
      </div>
      <div id="sample-bar"><div id="sample-fill"></div></div>
      <div id="sample-status">0 / 5 samples captured</div>
      <button class="btn btn-primary" id="save-btn" onclick="saveFace()" disabled>💾 Save Face to Slot</button>
    </div>
  </div>

  <!-- FACES LIST -->
  <div id="faces-section">
    <h2>Registered Faces <span id="face-count" style="color:var(--muted);font-weight:400"></span></h2>
    <div class="search-row">
      <input id="face-search" type="text" placeholder="Search names…" oninput="renderFaces()">
      <button class="btn btn-ghost btn-sm" onclick="loadFaces()">🔄 Refresh</button>
    </div>
    <div id="faces-grid">
      <div class="empty"><div class="empty-icon">👤</div><p>Connect to a slot to load faces</p></div>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="js/config.js"></script>
<script>
'use strict';

const CFG   = window.FL_CONFIG;
const SLOTS = CFG.slots || [];
let scriptUrl = '', apiToken = '', slotName = '';
let capturedDescs = [];
let autoCapturing = false;
let autoInterval  = null;
let allFaces = [];

// ── INIT ────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  populateSlots();
  loadSavedAuth();
  await loadModels();
  initCamera();
});

function populateSlots() {
  const sel = document.getElementById('a-slot');
  SLOTS.forEach(s => {
    const o = document.createElement('option');
    o.value = s.name; o.textContent = s.label || s.name; sel.appendChild(o);
  });
}

function loadSavedAuth() {
  const saved = safeJSON(localStorage.getItem('fl_admin_auth'));
  if (!saved) return;
  if (saved.url) document.getElementById('a-url').value   = saved.url;
  if (saved.tok) document.getElementById('a-token').value = saved.tok;
  if (saved.slot) {
    document.getElementById('a-slot').value = saved.slot;
    scriptUrl = saved.url; apiToken = saved.tok; slotName = saved.slot;
    updateSlotBadge();
    loadFaces();
  }
}

function saveAuth() {
  const url  = document.getElementById('a-url').value.trim();
  const tok  = document.getElementById('a-token').value.trim();
  const slot = document.getElementById('a-slot').value;
  if (!url || !tok || !slot) { showToast('Fill in all fields', 'error'); return; }
  if (!url.startsWith('https://script.google.com')) { showToast('Invalid URL', 'error'); return; }
  scriptUrl = url; apiToken = tok; slotName = slot;
  localStorage.setItem('fl_admin_auth', JSON.stringify({ url, tok, slot }));
  updateSlotBadge();
  showToast('Connected to ' + slot, 'success');
  loadFaces();
}

function updateSlotBadge() {
  const cfg = SLOTS.find(s => s.name === slotName);
  document.getElementById('slot-label').textContent = cfg ? (cfg.label || slotName) : slotName;
}

// ── MODELS ──────────────────────────────────────────────────────
async function loadModels() {
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  setML(0, 'Loading detector…');
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  setML(40, 'Loading landmarks…');
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  setML(75, 'Loading recognition net…');
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  setML(100, 'Ready');
  setTimeout(() => { document.getElementById('model-loader').style.display = 'none'; }, 400);
}

function setML(pct, txt) {
  document.getElementById('ml-prog').style.width = pct + '%';
  document.getElementById('ml-text').textContent = txt;
}

// ── CAMERA ──────────────────────────────────────────────────────
async function initCamera() {
  const video = document.getElementById('reg-video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 } }, audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      const c = document.getElementById('reg-canvas');
      c.width = video.videoWidth; c.height = video.videoHeight;
    };
    document.getElementById('cam-overlay').style.display = 'flex';
  } catch (e) {
    document.getElementById('cam-overlay').innerHTML = '<p style="color:var(--red);font-size:.8rem;padding:12px">Camera not available: ' + escHtml(e.message) + '</p>';
  }
}

// ── CAPTURE ─────────────────────────────────────────────────────
async function captureOnce() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { showToast('Enter a name first', 'error'); return; }
  const video = document.getElementById('reg-video');
  const opts  = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.5 });
  const det   = await faceapi.detectSingleFace(video, opts).withFaceLandmarks(true).withFaceDescriptor();
  if (!det) { showToast('No face detected — try again', 'info'); return; }
  capturedDescs.push(Array.from(det.descriptor));
  updateSampleUI();
  drawCaptureFeedback(det.detection.box, video.videoWidth, video.videoHeight);
}

function toggleAuto() {
  if (autoCapturing) stopAuto();
  else startAuto();
}

function startAuto() {
  const name = document.getElementById('reg-name').value.trim();
  if (!name) { showToast('Enter a name first', 'error'); return; }
  autoCapturing = true;
  document.getElementById('auto-btn').textContent = '⏹ Stop Auto';
  autoInterval = setInterval(async () => {
    if (capturedDescs.length >= 10) { stopAuto(); return; }
    await captureOnce();
  }, 1200);
}

function stopAuto() {
  autoCapturing = false;
  clearInterval(autoInterval);
  document.getElementById('auto-btn').textContent = '▶ Auto (5)';
}

function updateSampleUI() {
  const n = capturedDescs.length;
  const pct = Math.min(100, n / 5 * 100);
  document.getElementById('sample-fill').style.width = pct + '%';
  document.getElementById('sample-status').textContent = n + ' / 5 samples captured' + (n >= 5 ? ' ✓ Ready' : '');
  document.getElementById('save-btn').disabled = n < 3;
}

function drawCaptureFeedback(box, vw, vh) {
  const c   = document.getElementById('reg-canvas');
  const ctx = c.getContext('2d');
  const sx  = c.width  / vw, sy = c.height / vh;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.strokeStyle = 'var(--green)'; ctx.lineWidth = 2;
  ctx.shadowColor = '#00ff9d'; ctx.shadowBlur = 10;
  ctx.strokeRect(box.x*sx, box.y*sy, box.width*sx, box.height*sy);
  ctx.shadowBlur = 0;
  setTimeout(() => ctx.clearRect(0, 0, c.width, c.height), 500);
}

// ── SAVE ────────────────────────────────────────────────────────
async function saveFace() {
  if (!scriptUrl || !apiToken) { showToast('Connect to a slot first', 'error'); return; }
  const name = document.getElementById('reg-name').value.trim();
  if (!name || capturedDescs.length < 3) { showToast('Need a name and at least 3 samples', 'error'); return; }

  // Capture thumbnail from current frame
  const video = document.getElementById('reg-video');
  let thumb = '';
  try {
    const cv = document.createElement('canvas');
    cv.width = 64; cv.height = 64;
    cv.getContext('2d').drawImage(video, 0, 0, 64, 64);
    thumb = cv.toDataURL('image/jpeg', 0.6);
  } catch (_) {}

  document.getElementById('save-btn').disabled = true;
  document.getElementById('save-btn').textContent = 'Saving…';

  try {
    const res = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'registerFace', token: apiToken, name: sanitize(name), descriptors: capturedDescs, thumb })
    });
    const data = await res.json();
    if (data.success) {
      showToast(`✅ "${name}" registered (${capturedDescs.length} samples)`, 'success');
      capturedDescs = [];
      document.getElementById('reg-name').value = '';
      updateSampleUI();
      stopAuto();
      loadFaces();
    } else {
      showToast('Error: ' + (data.error || 'Unknown error'), 'error');
    }
  } catch (e) {
    showToast('Network error: ' + e.message, 'error');
  }
  document.getElementById('save-btn').disabled = false;
  document.getElementById('save-btn').textContent = '💾 Save Face to Slot';
}

// ── FACES LIST ──────────────────────────────────────────────────
async function loadFaces() {
  if (!scriptUrl || !apiToken) return;
  const grid = document.getElementById('faces-grid');
  grid.innerHTML = '<div class="empty"><div class="loader-spin">⟳</div><p style="margin-top:8px;color:var(--muted)">Loading…</p></div>';
  try {
    const res  = await fetch(`${scriptUrl}?action=getFaces&token=${encodeURIComponent(apiToken)}`);
    const data = await res.json();
    allFaces = data.faces || [];
    document.getElementById('face-count').textContent = `(${allFaces.length})`;
    renderFaces();
  } catch (e) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>${escHtml(e.message)}</p></div>`;
  }
}

function renderFaces() {
  const grid  = document.getElementById('faces-grid');
  const query = document.getElementById('face-search').value.toLowerCase();
  const list  = allFaces.filter(f => f.name.toLowerCase().includes(query));
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">👤</div><p>No faces registered yet</p></div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach(f => {
    const card = document.createElement('div');
    card.className = 'face-card';
    const hasThumb = f.thumb && f.thumb.startsWith('data:');
    card.innerHTML = `
      ${hasThumb
        ? `<img class="face-avatar" src="${f.thumb}" alt="${escHtml(f.name)}">`
        : `<div class="face-avatar-placeholder">👤</div>`
      }
      <div class="face-name">${escHtml(f.name)}</div>
      <div class="face-samples">${f.descriptors?.length || '?'} samples</div>
      <button class="face-delete" title="Delete" onclick="deleteFace('${escHtml(f.name)}')">✕</button>`;
    grid.appendChild(card);
  });
}

async function deleteFace(name) {
  if (!confirm(`Delete "${name}" from this slot? This cannot be undone.`)) return;
  try {
    const res  = await fetch(scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'deleteFace', token: apiToken, name })
    });
    const data = await res.json();
    if (data.success) {
      showToast(`"${name}" deleted`, 'success');
      loadFaces();
    } else {
      showToast('Error: ' + (data.error || 'Failed'), 'error');
    }
  } catch (e) {
    showToast('Network error', 'error');
  }
}

// ── UTILS ────────────────────────────────────────────────────────
function sanitize(s) { return String(s).replace(/[<>"'`]/g,'').substring(0,100); }
function escHtml(s)  { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function safeJSON(s) { try { return JSON.parse(s); } catch { return null; } }

function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
