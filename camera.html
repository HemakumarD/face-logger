<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://cdn.jsdelivr.net;">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>Face Logger – Camera</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);
  --accent:#6c63ff;--cyan:#00d4ff;--green:#00ff9d;--yellow:#ffcc00;--red:#ff4466;
  --text:#e0e0f0;--muted:#888;--radius:16px;--font:'Segoe UI',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow:hidden;user-select:none}
/* SETUP SCREEN */
#setup{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.setup-card{background:rgba(108,99,255,0.08);border:1px solid rgba(108,99,255,0.3);border-radius:24px;padding:36px;max-width:420px;width:100%;backdrop-filter:blur(20px)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:12px}
h1{font-size:1.6rem;font-weight:700;text-align:center}
h1 span{color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);font-size:.85rem;margin-top:4px;margin-bottom:28px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;margin-top:16px}
input,select{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.95rem;padding:12px 14px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--accent);background:rgba(108,99,255,0.1)}
select option{background:#1a1a2e}
.btn{width:100%;margin-top:24px;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;transition:.2s;letter-spacing:.03em}
.btn:active{opacity:.85;transform:scale(.98)}
.note{margin-top:16px;padding:12px;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);border-radius:10px;font-size:.8rem;color:var(--cyan);line-height:1.5}
/* CAMERA SCREEN */
#camera-view{display:none;position:fixed;inset:0;background:#000}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{position:absolute;inset:0;pointer-events:none}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;padding:16px;background:linear-gradient(to bottom,rgba(0,0,0,.7) 0%,transparent 100%);display:flex;align-items:center;gap:12px;pointer-events:none}
#hud-cam{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--accent);color:#fff;letter-spacing:.05em}
#hud-slot{font-size:.75rem;padding:4px 10px;border-radius:6px;background:rgba(0,212,255,.2);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
#hud-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* FEED */
#feed{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,rgba(0,0,0,.8) 0%,transparent 100%)}
#feed-title{font-size:.7rem;text-transform:uppercase;color:var(--muted);margin-bottom:8px;letter-spacing:.08em}
#feed-list{display:flex;flex-direction:column;gap:6px}
.feed-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-left:3px solid;animation:slideIn .3s ease}
.feed-item.known{border-color:var(--green)}
.feed-item.unknown{border-color:var(--yellow)}
.feed-thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#1a1a2e}
.feed-name{font-size:.85rem;font-weight:600}
.feed-meta{font-size:.7rem;color:var(--muted)}
.feed-time{margin-left:auto;font-size:.7rem;color:var(--muted)}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
/* COUNT BADGE */
#count-badge{position:absolute;top:60px;right:16px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:10px 14px;text-align:center;pointer-events:none}
#count-num{font-size:1.6rem;font-weight:700;color:var(--accent)}
#count-label{font-size:.65rem;color:var(--muted);letter-spacing:.06em}
/* QUEUE BADGE */
#queue-badge{position:absolute;top:60px;left:16px;background:rgba(255,204,0,.12);border:1px solid rgba(255,204,0,.3);border-radius:10px;padding:6px 10px;font-size:.75rem;color:var(--yellow);display:none}
/* OFFLINE BANNER */
#offline-banner{position:absolute;top:0;left:0;right:0;background:rgba(255,68,102,.9);color:#fff;text-align:center;padding:8px;font-size:.8rem;font-weight:600;display:none;z-index:99}
/* INSTALL BUTTON */
#install-btn{position:absolute;bottom:200px;right:16px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:.8rem;cursor:pointer;display:none}
/* MODEL LOADER */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200}
.loader-icon{font-size:48px;animation:spin 2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:.9rem;color:var(--muted)}
.progress-bar{width:240px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));width:0;transition:width .3s}
</style>
</head>
<body>

<!-- ── SETUP SCREEN ── -->
<div id="setup">
  <div class="setup-card">
    <div class="logo">
      <div class="logo-icon">📷</div>
      <h1>Face <span>Logger</span></h1>
      <p class="subtitle">v2 · Camera Setup</p>
    </div>
    <label>Alpha Slot API URL</label>
    <input id="s-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false">
    <label>Alpha Slot API Token</label>
    <input id="s-token" type="password" placeholder="Paste your Alpha API secret">
    <label>Camera Location</label>
    <select id="s-loc">
      <option value="">Select location…</option>
      <option value="Lift">Lift</option>
<option value="Staircase">Staircase</option>
    </select>
    <div class="note">🔒 These credentials are saved only on this device. They are never sent anywhere except to your own Google Apps Script.</div>
    <button class="btn" onclick="saveSetup()">💾 Save & Start Camera</button>
  </div>
</div>

<!-- ── MODEL LOADER ── -->
<div id="loader" style="display:none">
  <div class="loader-icon">🧠</div>
  <div class="loader-text" id="loader-text">Loading AI models…</div>
  <div class="progress-bar"><div class="progress-fill" id="loader-progress"></div></div>
</div>

<!-- ── CAMERA VIEW ── -->
<div id="camera-view">
  <div id="offline-banner">📡 OFFLINE – entries queued locally</div>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="hud">
    <div id="hud-cam">LIFT</div>
    <div id="hud-slot">α Alpha</div>
    <div id="hud-status">
      <div id="status-dot"></div>
      <span id="status-text">Scanning</span>
    </div>
  </div>

  <div id="count-badge">
    <div id="count-num">0</div>
    <div id="count-label">TODAY</div>
  </div>

  <div id="queue-badge" id="queue-b">⏳ <span id="queue-count">0</span> queued</div>

  <div id="feed">
    <div id="feed-title">Recent Detections</div>
    <div id="feed-list"></div>
  </div>

  <button id="install-btn" onclick="installPWA()">⬇ Install App</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script src="js/config.js"></script>
<script>
'use strict';

// ── CONFIG ──────────────────────────────────────────────────────
const CFG        = window.FL_CONFIG;
const DETECT_MS  = CFG.detectIntervalMs  || 2500;
const COOLDOWN   = CFG.cooldownMs        || 30000;
const THRESHOLD  = CFG.matchThreshold    || 0.50;
const SYNC_MS    = 60000;
const DB_NAME    = 'FaceLoggerDB';
const STORE_NAME = 'sync-queue';

let scriptUrl = '', apiToken = '', cameraLoc = '';
let faceMatcher = null;
let detecting   = false;
let wakeLock    = null;
let todayCount  = 0;
let idb         = null;
let deferredInstall = null;

// cooldown map: name → timestamp
const cooldowns = new Map();

// ── SETUP ───────────────────────────────────────────────────────
function initSetup() {
  const loc = document.getElementById('s-loc');
  (CFG.locations || ['Lift','Staircase']).forEach(l => {
    const o = document.createElement('option');
    o.value = l; o.textContent = l; loc.appendChild(o);
  });

  const saved = safeJSON(localStorage.getItem('fl_cam_config'));
  if (saved?.url) document.getElementById('s-url').value   = saved.url;
  if (saved?.tok) document.getElementById('s-token').value = saved.tok;
  if (saved?.loc) document.getElementById('s-loc').value   = saved.loc;

  if (saved?.url && saved?.tok && saved?.loc) saveSetup();
}

function saveSetup() {
  const url = document.getElementById('s-url').value.trim();
  const tok = document.getElementById('s-token').value.trim();
  const loc = document.getElementById('s-loc').value;
  if (!url || !tok || !loc) { alert('Please fill in all fields.'); return; }
  if (!url.startsWith('https://script.google.com')) { alert('URL must start with https://script.google.com'); return; }

  localStorage.setItem('fl_cam_config', JSON.stringify({ url, tok, loc }));
  scriptUrl = url; apiToken = tok; cameraLoc = loc;
  startApp();
}

// ── BOOT ────────────────────────────────────────────────────────
async function startApp() {
  document.getElementById('setup').style.display  = 'none';
  document.getElementById('loader').style.display = 'flex';
  document.getElementById('hud-cam').textContent  = cameraLoc.toUpperCase();

  await openIDB();
  await loadModels();
  await initCamera();
  await fetchFaces();

  document.getElementById('loader').style.display      = 'none';
  document.getElementById('camera-view').style.display = 'block';

  keepAwake();
  loadTodayCount();
  setInterval(runDetection, DETECT_MS);
  setInterval(syncQueue, SYNC_MS);
  syncQueue();
  monitorNetwork();
}

// ── MODELS ──────────────────────────────────────────────────────
async function loadModels() {
  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  setProgress(0, 'Loading detector…');
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  setProgress(40, 'Loading landmarks…');
  await faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL);
  setProgress(75, 'Loading recognition…');
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  setProgress(100, 'Ready!');
}

function setProgress(pct, text) {
  document.getElementById('loader-progress').style.width = pct + '%';
  document.getElementById('loader-text').textContent = text;
}

// ── CAMERA ──────────────────────────────────────────────────────
async function initCamera() {
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    resizeOverlay();
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      alert('Camera permission denied. Please allow camera access and reload.');
    } else if (err.name === 'NotFoundError') {
      alert('No camera found on this device.');
    } else {
      alert('Camera error: ' + err.message);
    }
    throw err;
  }
}

function resizeOverlay() {
  const v = document.getElementById('video');
  const c = document.getElementById('overlay');
  c.width  = v.videoWidth  || window.innerWidth;
  c.height = v.videoHeight || window.innerHeight;
  c.style.width  = '100%';
  c.style.height = '100%';
}

// ── FACES ───────────────────────────────────────────────────────
async function fetchFaces() {
  setProgress(90, 'Loading registered faces…');
  try {
    const res  = await fetch(`${scriptUrl}?action=getFaces&token=${encodeURIComponent(apiToken)}`);
    const data = await res.json();
    if (data.faces?.length) {
      buildMatcher(data.faces);
      localStorage.setItem('fl_faces_cache', JSON.stringify(data.faces));
    } else {
      const cached = safeJSON(localStorage.getItem('fl_faces_cache'));
      if (cached) buildMatcher(cached);
    }
  } catch (e) {
    const cached = safeJSON(localStorage.getItem('fl_faces_cache'));
    if (cached) buildMatcher(cached);
  }
}

function buildMatcher(faces) {
  const labeled = faces.map(f => {
    const descs = f.descriptors.map(d => new Float32Array(d));
    return new faceapi.LabeledFaceDescriptors(f.name, descs);
  });
  faceMatcher = labeled.length ? new faceapi.FaceMatcher(labeled, THRESHOLD) : null;
}

// ── DETECTION LOOP ──────────────────────────────────────────────
async function runDetection() {
  if (detecting) return;
  detecting = true;
  const video = document.getElementById('video');
  if (!video.videoWidth) { detecting = false; return; }

  try {
    const opts  = new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 });
    const dets  = await faceapi.detectAllFaces(video, opts)
                               .withFaceLandmarks(true)
                               .withFaceDescriptors();

    drawOverlay(dets, video.videoWidth, video.videoHeight);

    for (const det of dets) {
      const { x, y, width, height } = det.detection.box;
      let name    = 'Unknown Visitor';
      let isKnown = false;
      let conf    = '';

      if (faceMatcher) {
        const best = faceMatcher.findBestMatch(det.descriptor);
        if (best.label !== 'unknown') {
          name    = best.label;
          isKnown = true;
          conf    = (1 - best.distance).toFixed(3);
        }
      }

      if (!canLog(name)) continue;

      const thumb = captureThumb(video, { x, y, width, height });
      const snap  = captureSnap(video,  { x, y, width, height });
      const entry = {
        id:         crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36),
        timestamp:  new Date().toISOString(),
        camera:     cameraLoc,
        name,
        isKnown,
        confidence: conf,
        thumb,              // small 60×60, travels through rotation
        imageDataUrl: snap  // full snapshot, stored in Drive
      };

      cooldowns.set(name, Date.now());
      addFeed(entry);
      todayCount++;
      document.getElementById('count-num').textContent = todayCount;
      queueEntry(entry);
    }
  } catch (e) { console.warn('Detection error:', e); }
  detecting = false;
}

function canLog(name) {
  const last = cooldowns.get(name) || 0;
  return (Date.now() - last) > COOLDOWN;
}

// ── DRAWING ─────────────────────────────────────────────────────
function drawOverlay(dets, vw, vh) {
  const canvas = document.getElementById('overlay');
  const ctx    = canvas.getContext('2d');
  const scaleX = canvas.width  / vw;
  const scaleY = canvas.height / vh;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  dets.forEach(det => {
    if (!faceMatcher) return;
    const best    = faceMatcher.findBestMatch(det.descriptor);
    const known   = best.label !== 'unknown';
    const { x, y, width, height } = det.detection.box;
    const sx = x * scaleX, sy = y * scaleY, sw = width * scaleX, sh = height * scaleY;

    ctx.strokeStyle = known ? '#00ff9d' : '#ffcc00';
    ctx.lineWidth   = 2;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur  = 8;
    ctx.strokeRect(sx, sy, sw, sh);
    ctx.shadowBlur = 0;

    // Corner accents
    const c = 14;
    ctx.lineWidth = 3;
    [[sx,sy],[sx+sw,sy],[sx,sy+sh],[sx+sw,sy+sh]].forEach(([px,py]) => {
      ctx.beginPath();
      ctx.moveTo(px + (px===sx?c:-c), py); ctx.lineTo(px, py); ctx.lineTo(px, py + (py===sy?c:-c));
      ctx.stroke();
    });

    // Label
    const label = known ? best.label : 'Unknown';
    ctx.fillStyle = known ? '#00ff9d' : '#ffcc00';
    ctx.font = 'bold 13px system-ui';
    ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 4;
    ctx.fillText(label, sx + 4, sy - 6);
    ctx.shadowBlur = 0;
  });
}

// ── CAPTURE ─────────────────────────────────────────────────────
function captureThumb(video, box) {
  try {
    const size = CFG.thumbSize || 64;
    const cv   = document.createElement('canvas');
    cv.width   = size; cv.height = size;
    const ctx  = cv.getContext('2d');
    const { x, y, width: w, height: h } = box;
    const pad  = Math.min(w, h) * 0.15;
    ctx.drawImage(video, Math.max(0,x-pad), Math.max(0,y-pad), w+pad*2, h+pad*2, 0, 0, size, size);
    return cv.toDataURL('image/jpeg', 0.5); // small, compressed
  } catch (e) { return ''; }
}

function captureSnap(video, box) {
  try {
    const W   = CFG.snapshotWidth || 640;
    const cv  = document.createElement('canvas');
    cv.width  = W;
    const { x, y, width: w, height: h } = box;
    const pad = Math.min(w, h) * 0.2;
    const sw  = w + pad * 2;
    const sh  = h + pad * 2;
    cv.height = Math.round(W * sh / sw);
    cv.getContext('2d').drawImage(video, Math.max(0,x-pad), Math.max(0,y-pad), sw, sh, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.75);
  } catch (e) { return ''; }
}

// ── FEED ────────────────────────────────────────────────────────
function addFeed(entry) {
  const list = document.getElementById('feed-list');
  const div  = document.createElement('div');
  div.className = 'feed-item ' + (entry.isKnown ? 'known' : 'unknown');
  const t = new Date(entry.timestamp);
  const timeStr = t.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  div.innerHTML = `
    <img class="feed-thumb" src="${entry.thumb || 'data:image/gif;base64,R0lGODlhAQABAAAAACw='}" alt="">
    <div>
      <div class="feed-name">${escHtml(entry.name)}</div>
      <div class="feed-meta">${escHtml(entry.camera)} · ${entry.isKnown ? '✓ Known' : '? Unknown'}</div>
    </div>
    <div class="feed-time">${timeStr}</div>`;
  list.insertBefore(div, list.firstChild);
  while (list.children.length > 5) list.removeChild(list.lastChild);
}

// ── INDEXEDDB QUEUE ─────────────────────────────────────────────
function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME))
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
    };
    req.onsuccess = e => { idb = e.target.result; res(); };
    req.onerror   = e => rej(e.target.error);
  });
}

function queueEntry(entry) {
  if (!idb) return;
  const tx = idb.transaction(STORE_NAME, 'readwrite');
  tx.objectStore(STORE_NAME).add({ url: scriptUrl, token: apiToken, entry });
  updateQueueBadge();
  if (navigator.onLine) syncQueue();
  else if ('serviceWorker' in navigator && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => reg.sync?.register('fl-log-sync'));
  }
}

async function syncQueue() {
  if (!idb || !navigator.onLine) return;
  return new Promise(res => {
    const tx  = idb.transaction(STORE_NAME, 'readwrite');
    const str = tx.objectStore(STORE_NAME);
    str.getAll().onsuccess = async e => {
      const records = e.target.result;
      for (const rec of records) {
        try {
          const r = await fetch(rec.url, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ action: 'log', token: rec.token, entry: rec.entry })
          });
          if (r.ok) {
            const tx2 = idb.transaction(STORE_NAME, 'readwrite');
            tx2.objectStore(STORE_NAME).delete(rec.id);
          }
        } catch (_) {}
      }
      updateQueueBadge();
      res();
    };
  });
}

function updateQueueBadge() {
  if (!idb) return;
  const tx = idb.transaction(STORE_NAME, 'readonly');
  tx.objectStore(STORE_NAME).count().onsuccess = e => {
    const n   = e.target.result;
    const el  = document.getElementById('queue-badge');
    const cnt = document.getElementById('queue-count');
    if (n > 0) { el.style.display = 'block'; cnt.textContent = n; }
    else          el.style.display = 'none';
  };
}

// ── NETWORK MONITOR ─────────────────────────────────────────────
function monitorNetwork() {
  const banner = document.getElementById('offline-banner');
  const dot    = document.getElementById('status-dot');
  const st     = document.getElementById('status-text');
  function update() {
    const online = navigator.onLine;
    banner.style.display  = online ? 'none' : 'block';
    dot.style.background  = online ? 'var(--green)' : 'var(--red)';
    st.textContent        = online ? 'Scanning' : 'Offline';
    if (online) syncQueue();
  }
  window.addEventListener('online',  update);
  window.addEventListener('offline', update);
  update();
}

// ── WAKE LOCK ───────────────────────────────────────────────────
async function keepAwake() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => setTimeout(keepAwake, 1000));
  } catch (e) { console.log('Wake lock:', e.message); }
}

// ── PWA INSTALL ─────────────────────────────────────────────────
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  document.getElementById('install-btn').style.display = 'block';
});
function installPWA() {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(() => { deferredInstall = null; });
  document.getElementById('install-btn').style.display = 'none';
}

// ── TODAY COUNT ─────────────────────────────────────────────────
async function loadTodayCount() {
  try {
    const today = new Date().toISOString().substring(0, 10);
    const res   = await fetch(`${scriptUrl}?action=getLogs&token=${encodeURIComponent(apiToken)}&date=${today}&limit=1`);
    const data  = await res.json();
    if (data.total) {
      todayCount = data.total;
      document.getElementById('count-num').textContent = todayCount;
    }
  } catch (e) {}
}

// ── UTILS ───────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function safeJSON(s) { try { return JSON.parse(s); } catch { return null; } }

// ── SERVICE WORKER ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW:', e))
  );
}

// ── BOOT ────────────────────────────────────────────────────────
window.addEventListener('resize', resizeOverlay);
initSetup();
</script>
